          format: date-time
        to:
          type: string
          format: date-time
        dau:
          type: array
          items:
            $ref: '#/components/schemas/DailyActive'
        enrollments:
          type: integer
          minimum: 0
        completion_rate:
          type: number
          minimum: 0
          maximum: 100
        revenue:
          type: number
          minimum: 0
          multipleOf: 0.01
        currency:
          type: string
          minLength: 1
          maxLength: 12000
        revenue_source:
          type: string
          minLength: 1
          maxLength: 12000
      required:
