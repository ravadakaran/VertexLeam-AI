        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        course_title:
          type: string
          minLength: 1
          maxLength: 200
        progress_percent:
          type: number
          minimum: 0
          maximum: 100
        enrolled_at:
          type: string
          format: date-time
      required:
      - id
      - course_id
      - progress_percent
      - enrolled_at
    Range:
      type: object
      additionalProperties: false
      properties:
        start_seconds:
          type: integer
          minimum: 0
        end_seconds:
          type: integer
          minimum: 0
      required:
      - start_seconds
      - end_seconds
    Progress:
      type: object
      additionalProperties: false
      properties:
        position_seconds:
          type: integer
          minimum: 0
        watched_seconds:
          type: integer
          minimum: 0
        completed:
          type: boolean
        progress_percent:
          type: number
          minimum: 0
          maximum: 100
        last_watched_at:
          type: string
          format: date-time
      required:
      - position_seconds
      - watched_seconds
      - completed
      - progress_percent
    Note:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        lecture_id:
          type: string
          format: uuid
        timestamp_seconds:
          type: integer
          minimum: 0
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
      - id
      - lecture_id
      - timestamp_seconds
      - content
    Bookmark:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        lecture_id:
          type: string
          format: uuid
        timestamp_seconds:
          type: integer
          minimum: 0
      required:
      - id
      - lecture_id
      - timestamp_seconds
    Criterion:
      type: object
      additionalProperties: false
