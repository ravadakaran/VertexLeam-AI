components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Mode:
      type: string
      enum:
      - beginner
      - intermediate
      - advanced
    Role:
      type: string
      enum:
      - student
      - instructor
      - admin
    RoleAction:
      type: string
      enum:
      - assign
      - revoke
    Decision:
      type: string
      enum:
      - approved
      - rejected
    CourseStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - archived
    QuizStatus:
      type: string
      enum:
      - draft
      - approved
      - rejected
      - retired
    QuestionType:
      type: string
      enum:
      - mcq
      - multi_select
      - short_answer
    AttemptStatus:
      type: string
      enum:
      - in_progress
      - pending_review
      - graded
    JobStatus:
      type: string
      enum:
      - pending
      - running
      - ready
      - failed
    Moderation:
      type: string
      enum:
      - hide
      - restore
      - dismiss
    Profile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 180
        role:
          $ref: '#/components/schemas/Role'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        revision:
          type: string
          description: Opaque ETag value to send in If-Match.
      required:
      - id
      - full_name
      - role
      - roles
      - is_active
      - revision
    Tokens:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 12000
        refresh_token:
          type: string
          minLength: 1
          maxLength: 12000
        user:
          $ref: '#/components/schemas/Profile'
      required:
      - access_token
      - refresh_token
      - user
    Course:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        instructor_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 12000
        category:
          type: string
          minLength: 1
          maxLength: 80
        difficulty:
          $ref: '#/components/schemas/Mode'
        thumbnail_url:
          type: string
          format: uri
        price:
          type: number
          minimum: 0
          multipleOf: 0.01
        pricing_tier:
          type: string
          minLength: 1
          maxLength: 12000
        status:
          $ref: '#/components/schemas/CourseStatus'
        rating:
          type: number
          minimum: 0
          maximum: 5
        revision:
          type: string
          description: Opaque ETag value to send in If-Match.
      required:
      - id
      - instructor_id
      - title
      - category
      - difficulty
      - price
      - pricing_tier
      - status
      - revision
    CourseDetail:
      type: object
      additionalProperties: false
      properties:
        course:
          $ref: '#/components/schemas/Course'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
      required:
      - course
      - modules
    Module:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        order_index:
          type: integer
          minimum: 0
        lectures:
          type: array
          items:
            $ref: '#/components/schemas/Lecture'
      required:
      - id
      - course_id
      - title
      - order_index
    Lecture:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        module_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        order_index:
          type: integer
          minimum: 0
        duration_seconds:
          type: integer
          minimum: 0
        media_status:
          type: string
          minLength: 1
          maxLength: 12000
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
      required:
      - id
      - module_id
      - title
      - order_index
      - media_status
    Resource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 12000
      required:
      - id
      - title
    Enrollment:
      type: object
      additionalProperties: false
