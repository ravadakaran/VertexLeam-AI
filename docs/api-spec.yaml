      - title
      - body
      - is_read
      - created_at
    ErrorEnvelope:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 12000
            message:
              type: string
              minLength: 1
              maxLength: 12000
            field:
              type: string
              minLength: 1
              maxLength: 12000
          required:
          - code
          - message
  responses:
    Error400:
      description: Malformed request or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: email must be a valid email address
              field: email
    Error401:
      description: Missing, expired or revoked credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: Role or enrollment denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error404:
      description: Resource absent or outside visible scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: State, version or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error413:
      description: Upload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error415:
      description: Unsupported upload type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error422:
      description: Well-formed request violates a domain rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error429:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Seconds before retry, when known.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error503:
      description: Dependency unavailable
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Seconds before retry, when known.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
