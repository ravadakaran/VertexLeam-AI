          minLength: 1
          maxLength: 12000
      required:
      - id
      - status
    Flashcard:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
          minLength: 1
          maxLength: 12000
        answer:
          type: string
          minLength: 1
          maxLength: 12000
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
      required:
      - id
      - question
      - answer
      - sources
    StudyStep:
      type: object
      additionalProperties: false
