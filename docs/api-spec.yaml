openapi: 3.0.3
info:
  title: VertexLearn AI planned API
  version: 1.0.0
  description: PRD §8 baseline routes and proposed extensions. x-prd identifies baseline operations.
servers:
- url: /api/v1
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      summary: 'Register a new user (default role: student)'
      operationId: post_auth_register
      x-prd: '8.1'
      description: Public approved catalog metadata or public auth. Auth rate bucket applies.
      security: []
      responses:
        '201':
          description: Success
          headers:
            ETag:
              schema:
                type: string
              description: Current resource revision where applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 150
                email:
                  type: string
                  format: email
                  maxLength: 180
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
              required:
              - full_name
              - email
              - password
  /auth/login:
    post:
      summary: Returns access + refresh token
      operationId: post_auth_login
      x-prd: '8.1'
      description: Public approved catalog metadata or public auth. Auth rate bucket applies.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 180
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
              required:
              - email
              - password
  /auth/refresh:
    post:
      summary: Issues a new access token
      operationId: post_auth_refresh
      x-prd: '8.1'
      description: Valid refresh JWT required in request body. Logout permits replay. Auth rate bucket
        applies.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token:
                  type: string
                  minLength: 1
                  maxLength: 12000
              required:
              - refresh_token
  /auth/logout:
    post:
      summary: Invalidates refresh token
      operationId: post_auth_logout
      x-prd: '8.1'
      description: Valid refresh JWT required in request body. Logout permits replay. Auth rate bucket
        applies.
      security: []
      responses:
        '204':
          description: Completed
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token:
                  type: string
                  minLength: 1
                  maxLength: 12000
              required:
              - refresh_token
  /auth/me:
    get:
      summary: Returns current authenticated user profile
      operationId: get_auth_me
      x-prd: '8.1'
      description: Active authenticated account. Auth rate bucket applies.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              schema:
                type: string
              description: Current resource revision where applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /courses:
    get:
      summary: List/filter/search catalog (category, difficulty, q, page)
      operationId: get_courses
      x-prd: '8.2'
      description: Public approved catalog metadata or public auth.
      security: []
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 12000
      - name: difficulty
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Mode'
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 12000
      - name: rating_min
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 5
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                - limit
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
                  page:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      summary: Create a course (status defaults to pending)
      operationId: post_courses
      x-prd: '8.2'
      description: Instructor or admin. Instructor listing restricted to owned courses. Retry with the
        same key and equivalent payload.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      responses:
        '201':
          description: Success
          headers:
            ETag:
              schema:
                type: string
              description: Current resource revision where applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  minLength: 1
                  maxLength: 12000
                category:
                  type: string
                  minLength: 1
                  maxLength: 80
                difficulty:
                  $ref: '#/components/schemas/Mode'
                thumbnail_url:
                  type: string
                  format: uri
                price:
                  type: number
                  minimum: 0
                  multipleOf: 0.01
                pricing_tier:
                  type: string
                  minLength: 1
                  maxLength: 12000
              required:
              - title
              - category
              - difficulty
              - price
              - pricing_tier
  /courses/{id}:
    get:
      summary: Course detail with modules/lectures
      operationId: get_courses_id
      x-prd: '8.2'
      description: Public approved catalog metadata or public auth.
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      responses:
        '200':
          description: Success
          headers:
            ETag:
              schema:
                type: string
              description: Current resource revision where applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    put:
      summary: Update course metadata
      operationId: put_courses_id
      x-prd: '8.2'
      description: Instructor owning the resolved course or admin. Stale revisions return 409.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Current resource revision ETag.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              schema:
                type: string
              description: Current resource revision where applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  minLength: 1
                  maxLength: 12000
                category:
                  type: string
                  minLength: 1
                  maxLength: 80
                difficulty:
                  $ref: '#/components/schemas/Mode'
                thumbnail_url:
                  type: string
                  format: uri
                price:
                  type: number
                  minimum: 0
                  multipleOf: 0.01
                pricing_tier:
                  type: string
                  minLength: 1
                  maxLength: 12000
    delete:
      summary: delete courses id
      operationId: delete_courses_id
      x-prd: Proposed
      description: Instructor owning the resolved course or admin.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      responses:
        '204':
          description: Completed
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /courses/{id}/modules:
    post:
      summary: Add module
      operationId: post_courses_id_modules
      x-prd: '8.2'
      description: Instructor owning the resolved course or admin. Retry with the same key and equivalent
        payload.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                order_index:
                  type: integer
                  minimum: 0
              required:
              - title
              - order_index
  /modules/{id}/lectures:
    post:
      summary: Add lecture (multipart upload)
      operationId: post_modules_id_lectures
      x-prd: '8.2'
      description: Instructor owning the resolved course or admin. Retry with the same key and equivalent
        payload.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecture'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                order_index:
                  type: integer
                  minimum: 0
                video:
                  type: string
                  format: binary
                captions:
                  type: string
                  format: binary
                  description: Optional English WebVTT captions for the uploaded video.
                resources:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - title
              - order_index
  /courses/{id}/approve:
    post:
      summary: Approve/reject course
      operationId: post_courses_id_approve
      x-prd: '8.2'
      description: Active admin. Retry with the same key and equivalent payload. Stale revisions return
        409. The course must have a submitted revision.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Current resource revision ETag.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              schema:
                type: string
              description: Current resource revision where applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                decision:
                  $ref: '#/components/schemas/Decision'
                comment:
                  type: string
                  minLength: 1
                  maxLength: 12000
              required:
              - decision
  /courses/{id}/enroll:
    post:
      summary: Enroll current student
      operationId: post_courses_id_enroll
      x-prd: '8.3'
      description: Active student for own resources.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /enrollments/me:
    get:
      summary: List my enrolled courses with progress
      operationId: get_enrollments_me
      x-prd: '8.3'
      description: Active student for own resources.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                - limit
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Enrollment'
                  page:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /lectures/{id}/progress:
    post:
      summary: Update watched-seconds / mark complete
      operationId: post_lectures_id_progress
      x-prd: '8.3'
      description: Active student enrolled in the resolved course.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                position_seconds:
                  type: integer
                  minimum: 0
                event_id:
                  type: string
                  format: uuid
                playback_id:
                  type: string
                  format: uuid
                sequence:
                  type: integer
                  minimum: 0
                played_ranges:
                  type: array
                  items:
                    $ref: '#/components/schemas/Range'
              required:
              - position_seconds
              - event_id
              - playback_id
              - sequence
              - played_ranges
    get:
      summary: get lectures id progress
      operationId: get_lectures_id_progress
      x-prd: Proposed
      description: Active student enrolled in the resolved course.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /lectures/{id}/notes:
    post:
      summary: Add a note
      operationId: post_lectures_id_notes
      x-prd: '8.3'
      description: Active student enrolled in the resolved course. Retry with the same key and equivalent
        payload.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Course or resource identifier resolved in the route context
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timestamp_seconds:
                  type: integer
                  minimum: 0
                content:
                  type: string
                  minLength: 1
                  maxLength: 12000
              required:
              - timestamp_seconds
              - content
    get:
      summary: get lectures id notes
      operationId: get_lectures_id_notes
      x-prd: Proposed
      description: Active student enrolled in the resolved course.
      parameters:
      - name: id
        in: path
