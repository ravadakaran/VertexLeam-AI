        criterion_id:
          type: string
          format: uuid
        points:
          type: number
          minimum: 0
          multipleOf: 0.01
      required:
      - criterion_id
      - points
    Assignment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        instructions:
          type: string
          minLength: 1
          maxLength: 12000
        rubric:
          type: array
          items:
            $ref: '#/components/schemas/Criterion'
        due_date:
          type: string
          format: date-time
      required:
      - id
      - course_id
      - title
      - instructions
      - rubric
      - due_date
    Submission:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        submitted_at:
          type: string
          format: date-time
        grade:
          type: number
          minimum: 0
          maximum: 100
        feedback:
          type: string
          minLength: 1
          maxLength: 12000
        revision:
          type: string
          description: Opaque ETag value to send in If-Match.
      required:
      - id
      - assignment_id
      - user_id
      - submitted_at
      - revision
    OptionInput:
      type: object
      additionalProperties: false
      properties:
        option_text:
          type: string
          minLength: 1
          maxLength: 12000
        is_correct:
          type: boolean
      required:
      - option_text
      - is_correct
    Option:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        option_text:
          type: string
          minLength: 1
          maxLength: 12000
      required:
      - id
      - option_text
    QuestionInput:
      type: object
      additionalProperties: false
      properties:
        question_text:
          type: string
          minLength: 1
          maxLength: 12000
        question_type:
          $ref: '#/components/schemas/QuestionType'
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionInput'
        rubric:
          type: string
          minLength: 1
          maxLength: 12000
        topic_id:
          type: string
          format: uuid
        difficulty:
          $ref: '#/components/schemas/Mode'
        max_points:
          type: number
          minimum: 0
          multipleOf: 0.01
      required:
      - question_text
      - question_type
      - max_points
    Question:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        question_text:
          type: string
          minLength: 1
          maxLength: 12000
        question_type:
          $ref: '#/components/schemas/QuestionType'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        max_points:
          type: number
          minimum: 0
          multipleOf: 0.01
      required:
      - id
      - question_text
      - question_type
      - max_points
    Quiz:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        module_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/QuizStatus'
        is_ai_generated:
          type: boolean
        revision:
          type: string
          description: Opaque ETag value to send in If-Match.
      required:
      - id
      - module_id
      - title
      - status
      - is_ai_generated
      - revision
    QuizReview:
      type: object
      additionalProperties: false
      properties:
        quiz:
          $ref: '#/components/schemas/Quiz'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionInput'
        generated_from_lecture_id:
          type: string
          format: uuid
      required:
      - quiz
      - questions
    AnswerInput:
      type: object
      additionalProperties: false
      properties:
        question_id:
          type: string
          format: uuid
        selected_option_ids:
          type: array
          items:
            type: string
            format: uuid
        text_answer:
          type: string
          minLength: 1
          maxLength: 12000
      required:
      - question_id
    AnswerScore:
      type: object
      additionalProperties: false
      properties:
        question_id:
          type: string
          format: uuid
        points:
          type: number
          minimum: 0
          multipleOf: 0.01
      required:
      - question_id
      - points
    Attempt:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        quiz_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttemptStatus'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        review:
          description: Present only for the course author or administrator on the review queue.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [question_id, question_text, rubric, max_points]
            properties:
              question_id:
                type: string
                format: uuid
              question_text:
                type: string
              rubric:
                type: string
              max_points:
                type: number
              text_answer:
                type: string
        objective_score:
          type: number
          minimum: 0
          maximum: 100
        score:
          type: number
          minimum: 0
          maximum: 100
        submitted_at:
          type: string
          format: date-time
        revision:
          type: string
          description: Opaque ETag value to send in If-Match.
      required:
      - id
      - quiz_id
      - status
      - revision
    Session:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/Mode'
      required:
      - id
      - course_id
      - mode
    Source:
      type: object
      additionalProperties: false
      properties:
        lecture_id:
          type: string
          format: uuid
        lecture_title:
          type: string
          minLength: 1
          maxLength: 12000
        timestamp_seconds:
          type: integer
          minimum: 0
      required:
      - lecture_id
      - lecture_title
    ChatReply:
      type: object
      additionalProperties: false
      properties:
        reply:
          type: string
          minLength: 1
          maxLength: 12000
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          maxItems: 6
        mode:
          $ref: '#/components/schemas/Mode'
      required:
      - reply
      - sources
      - mode
      description: Successful grounded reply or insufficient-evidence fallback with an empty sources array.
    ChatMessage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
          minLength: 1
          maxLength: 12000
        content:
          type: string
          minLength: 1
          maxLength: 12000
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        created_at:
          type: string
          format: date-time
      required:
