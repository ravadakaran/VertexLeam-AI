name: Feature request
description: Suggest an improvement within the approved project scope.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Check the approved PRD, roadmap, and deferred scope before suggesting new work.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who encounters this problem, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes, including access or privacy behavior where relevant.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the approved PRD, implementation roadmap, and deferred enhancement boundary.
          required: true
