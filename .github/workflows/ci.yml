name: CI Verification
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r ai-service/requirements.txt pyyaml
      - name: Configure disposable services
        run: |
          db_password=$(openssl rand -hex 32)
          access_key=$(openssl rand -hex 32)
          refresh_key=$(openssl rand -hex 32)
          demo_password=$(openssl rand -hex 32)
          ai_token=$(openssl rand -hex 24)
          for secret in "$db_password" "$access_key" "$refresh_key" "$demo_password" "$ai_token"; do
            echo "::add-mask::$secret"
          done
          umask 077
          {
            echo "POSTGRES_PASSWORD=$db_password"
            echo "DATABASE_URL=postgresql://vertexlearn:$db_password@127.0.0.1:15432/vertexlearn"
            echo "REDIS_CACHE_URL=redis://127.0.0.1:16379"
            echo "REDIS_QUEUE_URL=redis://127.0.0.1:16379"
            echo "ACCESS_JWT_KEY=$access_key"
            echo "REFRESH_JWT_KEY=$refresh_key"
            echo "DEMO_PASSWORD=$demo_password"
            echo "AI_SERVICE_TOKEN=$ai_token"
            echo "APP_ENV=test"
            echo "RELEASE_ID=${{ github.sha }}"
          } > .env
      - run: python -c "import yaml; yaml.safe_load(open('docs/api-spec.yaml', encoding='utf-8'))"
      - run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet
      - run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
      - run: npm run db:migrate && npm run db:migrate
      - run: npm run db:seed && npm run db:seed
      - run: npm run demo:seed && npm run demo:seed
      - run: npm test
      - run: python -m compileall ai-service/app ai-service/tests && python -m unittest discover -s ai-service/tests -t ai-service -v
      - run: npm run typecheck && npm run build
      - run: docker build -f backend/Dockerfile -t vertexlearn-backend:${{ github.sha }} .
      - run: docker build -f frontend/Dockerfile -t vertexlearn-frontend:${{ github.sha }} .
      - run: docker build -f ai-service/Dockerfile -t vertexlearn-ai:${{ github.sha }} ai-service
      - run: bash infra/scripts/restore-drill.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
