services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: vertexlearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: vertexlearn
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vertexlearn -d vertexlearn']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    profiles: ['stack']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vertexlearn-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vertexlearn-local-dev-only}
    ports:
      - '127.0.0.1:19000:9000'
      - '127.0.0.1:19001:9001'
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.22
    profiles: ['stack']
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
  ai-service:
    build: ../ai-service
    profiles: ['ai', 'stack']
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AI_OUTBOUND_DATA_APPROVED: ${AI_OUTBOUND_DATA_APPROVED:-false}
    ports:
      - '127.0.0.1:18000:8000'
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    profiles: ['stack']
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_ENV: ${APP_ENV:-development}
      RELEASE_ID: ${RELEASE_ID:-stage-local}
      TRUST_PROXY: '1'
      DATABASE_URL: postgresql://vertexlearn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/vertexlearn
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis:6379
      WORKER_MODE: external
      ACCESS_JWT_KEY: ${ACCESS_JWT_KEY:?Set ACCESS_JWT_KEY}
      REFRESH_JWT_KEY: ${REFRESH_JWT_KEY:?Set REFRESH_JWT_KEY}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://127.0.0.1:18080}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_OUTBOUND_DATA_APPROVED: ${AI_OUTBOUND_DATA_APPROVED:-false}
      CERTIFICATE_POLICY_CONFIRMED: ${CERTIFICATE_POLICY_CONFIRMED:-false}
      ACCOUNT_DELETION_POLICY_CONFIRMED: ${ACCOUNT_DELETION_POLICY_CONFIRMED:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@vertexlearn.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    profiles: ['stack']
    command: ['node', 'backend/src/jobs/worker.ts']
    environment:
      APP_ENV: ${APP_ENV:-development}
      RELEASE_ID: ${RELEASE_ID:-stage-local}
      DATABASE_URL: postgresql://vertexlearn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/vertexlearn
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis:6379
      WORKER_MODE: external
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@vertexlearn.local}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    profiles: ['stack']
  edge:
    image: nginx:1.27-alpine
    profiles: ['stack']
    ports:
      - '127.0.0.1:18080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
volumes:
  postgres:
  minio:
