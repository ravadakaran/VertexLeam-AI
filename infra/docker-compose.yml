services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: vertexlearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: vertexlearn
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vertexlearn -d vertexlearn']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  ai-service:
    build: ../ai-service
    profiles: ['ai']
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AI_OUTBOUND_DATA_APPROVED: ${AI_OUTBOUND_DATA_APPROVED:-false}
    ports:
      - '127.0.0.1:18000:8000'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres:

